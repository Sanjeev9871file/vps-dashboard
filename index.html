<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudVPS Control Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          ⚡ CloudVPS Manager
        </h1>
        <p class="text-xs text-slate-400">Scalable High-Performance Cloud Engine</p>
      </div>
      <span id="apiStatus" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        API Online
      </span>
    </header>

    <!-- Create VPS Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
      <h2 class="text-lg font-semibold text-slate-200 mb-4">Deploy New Server</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Server Hostname</label>
          <input type="text" id="srvName" placeholder="e.g. prod-node-01" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Operating System</label>
          <select id="srvOs" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            <option value="Ubuntu 24.04 LTS">Ubuntu 24.04 LTS</option>
            <option value="Debian 12 Bookworm">Debian 12 Bookworm</option>
            <option value="Alpine Linux 3.20">Alpine Linux 3.20</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="button" onclick="deployVPS()" id="btnDeploy" class="w-full cursor-pointer bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition-all duration-150 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
            🚀 Launch Instance
          </button>
        </div>
      </div>
    </div>

    <!-- Active Servers List -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-slate-200">Provisioned Instances</h2>
        <button type="button" onclick="loadServers()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer">⟳ Refresh List</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950/60 text-xs uppercase text-slate-400 border-b border-slate-800">
            <tr>
              <th class="px-4 py-3">Server</th>
              <th class="px-4 py-3">IP Address</th>
              <th class="px-4 py-3">Status</th>
              <th class="px-4 py-3">Usage (CPU / RAM)</th>
              <th class="px-4 py-3 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="serverList" class="divide-y divide-slate-800">
            <tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">Loading instances...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = "https://vps-engine.onrender.com"; 

    function getMetrics(key) {
      let hash = 0;
      const str = String(key);
      for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) % 1000;
      const cpu = (hash % 60) + 15;
      const ram = ((hash * 7) % 50) + 25;
      return { cpu, ram };
    }

    async function loadServers() {
      const tbody = document.getElementById('serverList');
      try {
        const res = await fetch(`${API_BASE}/api/servers`);
        const data = await res.json();
        if (!data.servers || data.servers.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-6 text-center text-slate-500">No active servers yet. Deploy one above!</td></tr>';
          return;
        }

        tbody.innerHTML = data.servers.map(s => {
          const sId = String(s.id);
          const isRunning = s.status === 'running';
          const { cpu, ram } = isRunning ? getMetrics(sId) : { cpu: 0, ram: 0 };
          return `
          <tr class="hover:bg-slate-800/40 transition-colors">
            <td class="px-4 py-4">
              <div class="font-semibold text-white">${s.name}</div>
              <div class="text-xs text-slate-400">${s.os_name || 'Ubuntu 24.04'}</div>
            </td>
            <td class="px-4 py-4 font-mono text-emerald-400 text-xs select-all">${s.ip_address}</td>
            <td class="px-4 py-4">
              <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium ${
                isRunning ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
              }">
                <span class="w-1.5 h-1.5 rounded-full ${isRunning ? 'bg-emerald-400' : 'bg-amber-400'}"></span>
                ${s.status}
              </span>
            </td>
            <td class="px-4 py-4 w-48">
              <div class="space-y-1.5 text-xs">
                <div>
                  <div class="flex justify-between text-slate-400 text-[10px] mb-0.5"><span>CPU</span><span>${cpu}%</span></div>
                  <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div class="bg-indigo-500 h-1.5 rounded-full" style="width: ${cpu}%"></div>
                  </div>
                </div>
                <div>
                  <div class="flex justify-between text-slate-400 text-[10px] mb-0.5"><span>RAM</span><span>${ram}%</span></div>
                  <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div class="bg-teal-500 h-1.5 rounded-full" style="width: ${ram}%"></div>
                  </div>
                </div>
              </div>
            </td>
            <td class="px-4 py-4 text-right space-x-2">
              <button type="button" onclick="toggleServer('${sId}')" class="cursor-pointer text-xs px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-slate-200 border border-slate-700 transition">
                ${isRunning ? 'Stop' : 'Start'}
              </button>
              <button type="button" onclick="deleteServer('${sId}')" class="cursor-pointer text-xs px-3 py-1.5 rounded bg-rose-500/20 hover:bg-rose-500/30 active:bg-rose-500/40 text-rose-300 border border-rose-500/30 transition">
                Terminate
              </button>
            </td>
          </tr>
        `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-rose-400">Failed to load servers: ${err.message}</td></tr>`;
      }
    }

    async function deployVPS() {
      const name = document.getElementById('srvName').value.trim() || 'srv-' + Math.floor(Math.random() * 1000);
      const os = document.getElementById('srvOs').value;
      const btn = document.getElementById('btnDeploy');
      btn.disabled = true;
      btn.innerText = "Provisioning...";

      try {
        const res = await fetch(`${API_BASE}/api/create-vps`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, os })
        });
        const result = await res.json();
        alert(`Server ${result.server.name} Deployed!\nIP: ${result.server.ip}\nPassword: ${result.server.root_password}`);
        document.getElementById('srvName').value = '';
        await loadServers();
      } catch (e) {
        alert("Provisioning failed: " + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 Launch Instance";
      }
    }

    async function toggleServer(id) {
      try {
        const res = await fetch(`${API_BASE}/api/servers/${id}/toggle`, { method: 'POST' });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        await loadServers();
      } catch (e) {
        alert("Action failed: " + e.message);
      }
    }

    async function deleteServer(id) {
      if (!confirm("Are you sure you want to terminate this server?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/servers/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error("HTTP error " + res.status);
        await loadServers();
      } catch (e) {
        alert("Delete failed: " + e.message);
      }
    }

    window.onload = loadServers;
  </script>
</body>
</html>
